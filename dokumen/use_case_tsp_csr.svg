<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Use Case Sistem Informasi Pendataan dan Visualisasi TSP/CSR</title>
  <desc id="desc">Diagram hubungan Operator OPD, Analis Data Kominfo, Petugas BPKAD opsional, Pimpinan, dan Publik dengan fungsi sistem pendataan TSP/CSR.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.boundary{fill:#f8fafc;stroke:#64748b;stroke-width:2}.uc{fill:#fff;stroke:#2563eb;stroke-width:2}
      .assoc{fill:none;stroke:#94a3b8;stroke-width:2}.actor-line{stroke:#334155;stroke-width:3;stroke-linecap:round;fill:none}
      .actor-head{fill:#fff;stroke:#334155;stroke-width:3}.label{font:600 19px Arial,sans-serif;fill:#0f172a;text-anchor:middle}
      .actor-label{font:600 17px Arial,sans-serif;fill:#0f172a;text-anchor:middle}.boundary-label{font:700 22px Arial,sans-serif;fill:#1e293b}
      .note{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.note-text{font:14px Arial,sans-serif;fill:#1e3a8a}
    </style>
  </defs>
  <rect class="bg" width="1440" height="980"/>

  <!-- Actor associations -->
  <g class="assoc">
    <path d="M170 208 C270 208 345 185 430 185"/>
    <path d="M170 208 C285 230 340 345 430 345"/>
    <path d="M170 482 C265 482 345 505 430 505"/>
    <path d="M170 482 C280 500 340 665 430 665"/>
    <path d="M170 482 C310 450 650 185 790 185"/>
    <path d="M170 482 C320 470 650 345 790 345"/>
    <path d="M170 482 C380 520 640 665 790 665"/>
    <path d="M170 730 C420 730 610 505 790 505"/>
    <path d="M1270 275 C1160 275 1085 185 1030 185"/>
    <path d="M1270 275 C1160 290 1100 345 1030 345"/>
    <path d="M1270 790 C1155 790 1095 790 1030 790"/>
  </g>

  <!-- System boundary -->
  <rect class="boundary" x="350" y="55" width="740" height="870" rx="14"/>
  <text class="boundary-label" x="380" y="92">Sistem Informasi Pendataan dan Visualisasi TSP/CSR</text>

  <!-- Use cases -->
  <g>
    <ellipse class="uc" cx="540" cy="185" rx="120" ry="48"/>
    <text class="label" x="540" y="179"><tspan x="540">Mengelola catatan</tspan><tspan x="540" dy="23">kegiatan</tspan></text>

    <ellipse class="uc" cx="540" cy="345" rx="120" ry="48"/>
    <text class="label" x="540" y="339"><tspan x="540">Mengirim data</tspan><tspan x="540" dy="23">kegiatan</tspan></text>

    <ellipse class="uc" cx="540" cy="505" rx="120" ry="48"/>
    <text class="label" x="540" y="499"><tspan x="540">Mengimpor dan</tspan><tspan x="540" dy="23">menata data</tspan></text>

    <ellipse class="uc" cx="540" cy="665" rx="120" ry="48"/>
    <text class="label" x="540" y="659"><tspan x="540">Meninjau kelengkapan</tspan><tspan x="540" dy="23">data</tspan></text>

    <ellipse class="uc" cx="910" cy="185" rx="120" ry="48"/>
    <text class="label" x="910" y="179"><tspan x="910">Melihat dashboard, filter,</tspan><tspan x="910" dy="23">dan skenario hitung</tspan></text>

    <ellipse class="uc" cx="910" cy="345" rx="120" ry="48"/>
    <text class="label" x="910" y="339"><tspan x="910">Mengekspor</tspan><tspan x="910" dy="23">laporan</tspan></text>

    <ellipse class="uc" cx="910" cy="505" rx="120" ry="48"/>
    <text class="label" x="910" y="499"><tspan x="910">Memperbarui referensi</tspan><tspan x="910" dy="23">RKUD / BAST / KIB</tspan></text>

    <ellipse class="uc" cx="910" cy="665" rx="120" ry="48"/>
    <text class="label" x="910" y="659"><tspan x="910">Menyiapkan dan menerbitkan</tspan><tspan x="910" dy="23">ringkasan publik</tspan></text>

    <ellipse class="uc" cx="910" cy="790" rx="120" ry="48"/>
    <text class="label" x="910" y="784"><tspan x="910">Melihat ringkasan</tspan><tspan x="910" dy="23">publik yang tersedia</tspan></text>
  </g>

  <!-- Scope note -->
  <rect class="note" x="380" y="860" width="610" height="48" rx="8"/>
  <text class="note-text" x="400" y="881"><tspan x="400">Skenario hitung tidak mengubah data sumber dan bukan penilaian harga.</tspan></text>

  <!-- Actors -->
  <g aria-label="Operator OPD">
    <circle class="actor-head" cx="110" cy="170" r="18"/><path class="actor-line" d="M110 188v66M78 211h64M110 254l-24 34M110 254l24 34"/>
    <text class="actor-label" x="110" y="318">Operator OPD</text>
  </g>
  <g aria-label="Analis Data Kominfo">
    <circle class="actor-head" cx="110" cy="445" r="18"/><path class="actor-line" d="M110 463v66M78 486h64M110 529l-24 34M110 529l24 34"/>
    <text class="actor-label" x="110" y="590"><tspan x="110">Analis Data</tspan><tspan x="110" dy="22">Kominfo</tspan></text>
  </g>
  <g aria-label="Petugas BPKAD opsional">
    <circle class="actor-head" cx="110" cy="690" r="18"/><path class="actor-line" d="M110 708v48M78 728h64M110 756l-20 26M110 756l20 26"/>
    <text class="actor-label" x="110" y="810"><tspan x="110">Petugas BPKAD</tspan><tspan x="110" dy="21">(opsional)</tspan></text>
  </g>
  <g aria-label="Pimpinan atau pengguna internal">
    <circle class="actor-head" cx="1310" cy="235" r="18"/><path class="actor-line" d="M1310 253v66M1278 276h64M1310 319l-24 34M1310 319l24 34"/>
    <text class="actor-label" x="1310" y="390"><tspan x="1310">Pimpinan / Pengguna</tspan><tspan x="1310" dy="22">Internal</tspan></text>
  </g>
  <g aria-label="Publik">
    <circle class="actor-head" cx="1310" cy="750" r="18"/><path class="actor-line" d="M1310 768v66M1278 791h64M1310 834l-24 34M1310 834l24 34"/>
    <text class="actor-label" x="1310" y="900">Publik</text>
  </g>
</svg>
